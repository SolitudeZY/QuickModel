<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>玻璃窗 · 五种天气</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --emerald-500: #10b981;
  --emerald-400: #34d399;
  --bg-dark: rgba(0, 0, 0, 0.2);
  --panel-bg: rgba(0, 0, 0, 0.65);
  --ui-label: rgba(209, 250, 229, 0.7);
  --ui-dim: rgba(255, 255, 255, 0.3);
  --font-mono: 'Geist Mono', monospace;
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'Inter', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #030508; color: #fff; font-family: var(--font-sans); }
canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

#weather-bar {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  z-index: 100;
  display: flex; align-items: center; gap: 4px;
  padding: 6px 8px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 40px;
  user-select: none;
  transition: opacity 0.3s;
}
.weather-btn {
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 30px;
  color: rgba(255,255,255,0.4);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: all 0.25s;
  white-space: nowrap;
}
.weather-btn:hover { color: rgba(255,255,255,0.7); }
.weather-btn.active { color: #fff; background: rgba(16,185,129,0.2); }
.weather-btn .icon { font-size: 14px; }

#sidebar {
  position: fixed; top: 50%; right: 28px; transform: translateY(-50%);
  width: 300px; max-height: 80vh;
  background: var(--panel-bg);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 24px;
  z-index: 100;
  display: flex; flex-direction: column; gap: 18px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
#sidebar.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(20px); }

.panel-section { display: flex; flex-direction: column; gap: 14px; }
.section-title {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ui-dim); margin-bottom: 2px;
}
.slider-row { display: flex; flex-direction: column; gap: 8px; }
.slider-header { display: flex; justify-content: space-between; align-items: center; }
.slider-label {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--ui-label);
}
.slider-value { font-family: var(--font-mono); font-size: 9px; color: var(--emerald-500); }

input[type=range] {
  -webkit-appearance: none; width: 100%; height: 2px;
  background: #1a1a1a; border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--emerald-500); cursor: pointer;
  box-shadow: 0 0 10px rgba(16,185,129,0.5); border: none;
}
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--emerald-500); cursor: pointer;
  box-shadow: 0 0 10px rgba(16,185,129,0.5); border: none;
}

#top-actions {
  position: fixed; top: 24px; right: 28px;
  display: flex; flex-direction: column; gap: 8px; z-index: 110;
}
.action-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--panel-bg); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  color: var(--ui-dim); cursor: pointer; transition: all 0.2s;
}
.action-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); transform: scale(1.05); }
.action-btn svg { width: 18px; height: 18px; }

#title-bar {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 50; text-align: center;
  opacity: 0.6; transition: opacity 0.3s;
  pointer-events: none;
}
#title-bar:hover { opacity: 1; }
#weather-name {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3em;
  text-transform: uppercase; color: rgba(255,255,255,0.5);
}
#weather-sub {
  font-family: var(--font-serif); font-size: 13px; font-style: italic;
  color: rgba(255,255,255,0.3); margin-top: 4px;
}

#btn-restore {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  z-index: 110; opacity: 0; pointer-events: none;
  background: var(--panel-bg); backdrop-filter: blur(12px);
  padding: 10px 24px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--ui-dim); font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
}
#btn-restore.visible { opacity: 1; pointer-events: all; }

@media (max-width: 768px) {
  #weather-bar { top: 12px; gap: 2px; padding: 4px 6px; flex-wrap: nowrap; overflow-x: auto; }
  .weather-btn { padding: 6px 10px; font-size: 8px; }
  .weather-btn .icon { font-size: 11px; }
  #sidebar { width: calc(100vw - 16px); right: 8px; left: 8px; border-radius: 12px; }
  #top-actions { right: 12px; top: 12px; }
  .action-btn { width: 34px; height: 34px; }
  #title-bar { bottom: 16px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="weather-bar">
  <button class="weather-btn active" data-mode="0"><span class="icon">☀️</span> 晴</button>
  <button class="weather-btn" data-mode="1"><span class="icon">⛅</span> 多云</button>
  <button class="weather-btn" data-mode="2"><span class="icon">🌧️</span> 雨</button>
  <button class="weather-btn" data-mode="3"><span class="icon">❄️</span> 雪</button>
  <button class="weather-btn" data-mode="4"><span class="icon">🌫️</span> 雾</button>
</div>

<div id="top-actions">
  <button class="action-btn" id="btn-toggle-ui" title="Toggle UI">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button class="action-btn" id="btn-toggle-sidebar" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>
</div>

<button id="btn-restore">RESTORE UI</button>

<div id="sidebar">
  <div class="panel-section">
    <div class="section-title">Weather</div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Intensity</span>
        <span class="slider-value" id="val-intensity">100%</span>
      </div>
      <input type="range" id="sl-intensity" min="0" max="2" step="0.01" value="1.0">
    </div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Speed</span>
        <span class="slider-value" id="val-speed">1.0x</span>
      </div>
      <input type="range" id="sl-speed" min="0.1" max="5" step="0.1" value="1.0">
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Glass</div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Condensation</span>
        <span class="slider-value" id="val-cond">30%</span>
      </div>
      <input type="range" id="sl-cond" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Refraction</span>
        <span class="slider-value" id="val-refr">100%</span>
      </div>
      <input type="range" id="sl-refr" min="0" max="3" step="0.05" value="1.0">
    </div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Brightness</span>
        <span class="slider-value" id="val-bright">0.00</span>
      </div>
      <input type="range" id="sl-bright" min="-0.5" max="0.5" step="0.01" value="0.00">
    </div>
  </div>

  <div class="panel-section" id="lightning-section" style="display:none">
    <div class="section-title">Lightning</div>
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-label">Flash Rate</span>
        <span class="slider-value" id="val-lightning">0%</span>
      </div>
      <input type="range" id="sl-lightning" min="0" max="1" step="0.01" value="0">
    </div>
  </div>

  <div style="flex:1"></div>
  <div style="opacity:0.2;font-family:var(--font-mono);font-size:7px;text-align:center;letter-spacing:2px;">
    GLASS WEATHER · 五种天气
  </div>
</div>

<div id="title-bar">
  <div id="weather-name">☀️ 晴天</div>
  <div id="weather-sub">阳光透过玻璃窗洒落</div>
</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) { document.body.innerHTML = 'WebGL2 not supported'; throw 0; }

const VS = `#version 300 es
in vec2 a_pos;
void main(){ gl_Position=vec4(a_pos,0,1); }
`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform float     u_t;
uniform vec2      u_res;
uniform float     u_mode;
uniform float     u_intensity;
uniform float     u_speed;
uniform float     u_cond;
uniform float     u_refr;
uniform float     u_bright;
uniform float     u_lightning;
uniform sampler2D u_bgTex;
uniform float     u_bgAspect;
uniform float     u_bgReady;

#define S(a,b,t) smoothstep(a,b,t)

// ── Hash / Noise ──
vec3 N13(float p){
    vec3 p3=fract(vec3(p)*vec3(.1031,.11369,.13787));
    p3+=dot(p3,p3.yzx+19.19);
    return fract(vec3((p3.x+p3.y)*p3.z,(p3.x+p3.z)*p3.y,(p3.y+p3.z)*p3.x));
}
float N(float t){return fract(sin(t*12345.564)*7658.76);}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float Saw(float b,float t){return S(0.,b,t)*S(1.,b,t);}

float vnoise(vec2 p){
    vec2 i=floor(p); vec2 f=fract(p);
    f=f*f*(3.-2.*f);
    float a=hash(i), b=hash(i+vec2(1,0));
    float c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
    return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
    float v=0.,a=0.5;
    mat2 r=mat2(0.82,-0.57,0.57,0.82);
    for(int i=0;i<5;i++){ v+=a*vnoise(p); p=r*p*2.03+1.7; a*=0.5; }
    return v;
}

// ── Rain Drops (from Heartfelt / amado_rain) ──
vec2 DropLayer2(vec2 uv, float t){
    vec2 UV=uv;
    uv.y+=t*0.75;
    vec2 a=vec2(6.,1.);
    vec2 grid=a*2.;
    vec2 id=floor(uv*grid);
    float colShift=N(id.x);
    uv.y+=colShift;
    id=floor(uv*grid);
    vec3 n=N13(id.x*35.2+id.y*2376.1);
    vec2 st=fract(uv*grid)-vec2(.5,0.);
    float x=n.x-.5;
    float y=UV.y*20.;
    float wiggle=sin(y+sin(y));
    x+=wiggle*(.5-abs(x))*(n.z-.5);
    x*=.7;
    float ti=fract(t+n.z);
    y=(Saw(.85,ti)-.5)*.9+.5;
    vec2 p=vec2(x,y);
    float d=length((st-p)*a.yx);
    float mainDrop=S(.4,.0,d);
    float r=sqrt(S(1.,y,st.y));
    float cd=abs(st.x-x);
    float trail=S(.23*r,.15*r*r,cd);
    float trailFront=S(-.02,.02,st.y-y);
    trail*=trailFront*r*r;
    y=UV.y;
    float trail2=S(.2*r,.0,cd);
    float droplets=max(0.,(sin(y*(1.-y)*120.)-st.y))*trail2*trailFront*n.z;
    y=fract(y*10.)+(st.y-.5);
    float dd=length(st-vec2(x,y));
    droplets=S(.3,0.,dd);
    float m=mainDrop+droplets*r*trailFront;
    return vec2(m,trail);
}
float StaticDrops(vec2 uv, float t){
    uv*=40.;
    vec2 id=floor(uv);
    uv=fract(uv)-.5;
    vec3 n=N13(id.x*107.45+id.y*3543.654);
    vec2 p=(n.xy-.5)*.7;
    float d=length(uv-p);
    float fade=Saw(.025,fract(t+n.z));
    float c=S(.3,0.,d)*fract(n.z*10.)*fade;
    return c;
}
vec2 Drops(vec2 uv, float t, float l0, float l1, float l2){
    float s=StaticDrops(uv,t)*l0;
    vec2 m1=DropLayer2(uv,t)*l1;
    vec2 m2=DropLayer2(uv*1.85,t)*l2;
    float c=s+m1.x+m2.x;
    c=S(.3,1.,c);
    return vec2(c,max(m1.y*l0,m2.y*l1));
}

// ── Snow ──
float snowflake(vec2 uv, float t, float scale, float seed){
    vec2 p=uv*scale;
    p.y+=t*0.3;
    p.x+=t*0.05*seed;
    vec2 id=floor(p);
    vec2 f=fract(p)-.5;
    float h=hash(id+seed);
    vec2 off=vec2(h-.5,hash(id+seed*1.3)-.5)*.6;
    f-=off;
    float sway=sin(t*0.5+h*6.28)*0.08;
    f.x+=sway;
    float d=length(f);
    float sz=mix(0.028,0.105,h);
    float flake=S(sz*1.2,0.,d);
    float hex=abs(f.x)+abs(f.y)+abs(f.x-f.y);
    float hexMask=S(sz*0.6,sz*0.3,hex);
    return max(flake,hexMask*0.26)*S(.08,.76,h+u_intensity*0.24);
}
float snowDepth(vec2 uv,float t,float scale,float seed,float depth){
    vec2 p=uv*scale;
    p.y+=t*(.16+depth*.26);
    p.x+=sin(t*.21+seed)*.035*depth;
    vec2 id=floor(p);
    vec2 f=fract(p)-.5;
    float h=hash(id+seed*1.71);
    f-=vec2(h-.5,hash(id+seed*2.37)-.5)*.72;
    f.x+=sin(t*(.32+depth*.24)+h*6.283)*.045*depth;
    float d=length(f);
    float size=mix(.022,.10,h)*mix(.55,1.4,depth);
    float core=S(size,size*.12,d);
    float glow=S(size*2.5,0.,d)*.18*depth;
    return max(core,glow)*S(.10,.78,h+u_intensity*.25);
}
vec3 snowBackdrop(vec2 uv,float t){
    vec3 sky=mix(vec3(.17,.23,.35),vec3(.72,.75,.86),smoothstep(.03,.88,uv.y));
    float haze=fbm(uv*2.4+vec2(t*.004,-t*.002));
    sky+=haze*vec3(.09,.08,.12);
    float ridgeA=.26+max(0.,1.-abs(uv.x-.30)/.48)*.46;
    float ridgeB=.30+max(0.,1.-abs(uv.x-.77)/.40)*.38;
    float farMountain=1.-smoothstep(ridgeA-.018,ridgeA+.018,uv.y);
    float nearMountain=1.-smoothstep(ridgeB-.014,ridgeB+.014,uv.y);
    sky=mix(sky,vec3(.18,.25,.35),farMountain*.78);
    sky=mix(sky,vec3(.08,.14,.22),nearMountain*.82);
    float capA=smoothstep(ridgeA-.13,ridgeA-.02,uv.y)*(1.-smoothstep(ridgeA-.01,ridgeA+.018,uv.y));
    float capB=smoothstep(ridgeB-.10,ridgeB-.018,uv.y)*(1.-smoothstep(ridgeB-.008,ridgeB+.014,uv.y));
    sky=mix(sky,vec3(.72,.79,.87),capA*.72);
    sky=mix(sky,vec3(.64,.72,.81),capB*.48);
    float valleyHaze=(1.-smoothstep(.05,.42,uv.y))*(.22+haze*.18);
    return mix(sky,vec3(.48,.57,.68),valleyHaze);
}
float snowAccum(vec2 uv, float t){
    float n=fbm(uv*5.+vec2(0,t*0.005));
    float n2=fbm(uv*8.+vec2(t*0.003,0));
    return S(.35,.7,n*.5+n2*.5);
}
float frostEdge(vec2 uv, float t){
    float edgeDist=min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y));
    float edge=1.-S(.01,.2,edgeDist);
    float crystal=fbm(uv*vec2(12.,18.)+vec2(2.,-t*0.008));
    float veins=abs(sin((uv.x*1.7+uv.y)*34.+crystal*7.));
    return S(.5,.85,edge*.5+crystal*.4+veins*edge*.1);
}

// ── Fog ──
float fogDensity(vec2 uv, float t){
    vec2 p=uv*1.5;
    float n1=fbm(p+vec2(t*0.005,0));
    float n2=fbm(p*2.3-vec2(0,t*0.003));
    float n3=fbm(p*3.7+vec2(t*0.004,t*0.002));
    return S(.2,.8,n1*.4+n2*.3+n3*.3);
}

// ── Background texture (cover mode) ──
vec3 getBg(vec2 uv, vec2 res){
    if(u_bgReady < 0.5){
        vec2 p=uv-.5;
        p.x*=res.x/max(res.y,1.);
        float cloud=fbm(p*2.2+vec2(u_t*.006,-u_t*.003));
        vec3 top=vec3(.05,.12,.21);
        vec3 bottom=vec3(.18,.36,.45);
        return mix(top,bottom,smoothstep(-.55,.52,uv.y))+cloud*vec3(.08,.12,.15);
    }
    float bgAspect=u_bgAspect;
    float canvasAspect=res.x/res.y;
    vec2 bgUV=uv;
    if(bgAspect>canvasAspect){
        float scale=canvasAspect/bgAspect;
        bgUV.x=(bgUV.x-0.5)/scale+0.5;
    }else{
        float scale=bgAspect/canvasAspect;
        bgUV.y=(bgUV.y-0.5)/scale+0.5;
    }
    return texture(u_bgTex,bgUV).rgb;
}

// ── Main ──
void main(){
    vec2 fragCoord=gl_FragCoord.xy;
    vec2 UV=fragCoord/u_res;
    vec2 uv=(fragCoord-.5*u_res)/u_res.y;

    float t=u_t*0.2*u_speed;
    float mode=u_mode;
    float intensity=u_intensity;
    float cond=u_cond;
    float refr=u_refr;
    float bright=u_bright;
    float lightning=u_lightning;

    // Select background based on weather mode
    vec3 bgCol;
    float modeIdx=floor(mode+0.5);

    // Use real background texture with weather-specific adjustments
    bgCol=getBg(UV,u_res);

    if(modeIdx==0.){
        // Sunny - warm up, add sun glow
        vec3 warmTint=mix(vec3(1.,1.,1.),vec3(1.,.85,.6),0.15);
        bgCol*=warmTint;
        float sunDist=length(UV-vec2(0.25,0.3));
        float sunGlow=exp(-sunDist*40.)*0.2;
        bgCol+=vec3(1.,.85,.5)*sunGlow;
    }else if(modeIdx==1.){
        // Cloudy - desaturate, darken, add cloud shadows
        float gray=dot(bgCol,vec3(.299,.587,.114));
        bgCol=mix(bgCol,vec3(gray),0.3);
        float cldSh=S(.3,.7,fbm(UV*1.2+vec2(t*0.01,0)));
        bgCol*=mix(.7,1.,cldSh);
    }else if(modeIdx==2.){
        // Rain - darken + blue tint
        vec3 rainTint=mix(vec3(1.,1.,1.),vec3(.5,.6,.8),0.2);
        bgCol*=rainTint;
        bgCol*=0.7;
    }else if(modeIdx==3.){
        // Snow - layered cold mountain atmosphere, inspired by snowy-window scenes
        bgCol=snowBackdrop(UV,t);
        bgCol=mix(bgCol,vec3(.72,.78,.86),.06);
    }else{
        // Fog - desaturate, fog overlay
        float dens=fogDensity(UV,t);
        vec3 fogTint=mix(vec3(.5,.55,.6),vec3(.3,.35,.4),dens);
        bgCol=mix(bgCol,fogTint,0.35);
        bgCol*=0.8;
    }

    vec3 col=bgCol;

    // ── Weather-specific glass effects ──
    if(modeIdx==0.){
        // Sunny - dust motes floating
        float dust=0.;
        for(int i=0;i<3;i++){
            vec2 dp=UV*4.+vec2(t*0.02*float(i+1),sin(t*0.03+float(i)*2.3)*0.1);
            dust+=vnoise(dp)*0.05;
        }
        col+=dust*vec3(1.,.9,.7);
    }

    if(modeIdx==1.){
        // Cloudy - subtle glass warp
        vec2 warp=vec2(fbm(UV*8.+t*0.005)-.5,fbm(UV*8.+t*0.008+5.)-.5)*cond*0.005*refr;
        col=mix(col,getBg(UV+warp,u_res),0.3);
    }

    if(modeIdx==2.){
        // Rain on glass (amado_rain style)
        float rainAmount=intensity;
        float staticDropsAmt=S(-.5,1.,rainAmount)*2.;
        float layer1=S(.25,.75,rainAmount);
        float layer2=S(.0,.5,rainAmount);
        vec2 c=Drops(UV,t,staticDropsAmt,layer1,layer2);
        vec2 e=vec2(.001,0.);
        float cx=Drops(UV+e,t,staticDropsAmt,layer1,layer2).x;
        float cy=Drops(UV+e.yx,t,staticDropsAmt,layer1,layer2).x;
        vec2 n=vec2(cx-c.x,cy-c.x);
        n*=refr*1.5;
        // Refract background
        vec3 refrCol=getBg(UV+n*0.02,u_res);
        float rainTint=0.3;
        col=mix(getBg(UV,u_res),refrCol,rainTint);
        // Rain drop highlights
        float rim=pow(c.x,1.5)*0.3;
        col+=vec3(.6,.8,.9)*rim*0.12;
        col*=1.-c.y*0.12;
        // Lightning
        if(lightning>0.01){
            float lt=sin(t*sin(t*10.));
            lt*=pow(max(0.,sin(t+sin(t))),10.);
            col*=1.+lt*lightning*2.0;
        }
    }

    if(modeIdx==3.){
        // Snow on glass
        float far=snowDepth(UV,t,52.,1.,.22)*.45;
        float farFine=snowflake(UV,t,40.,7.)*.24;
        float mid=snowDepth(UV+vec2(.1,0),t,28.,13.,.56)*.68;
        float midFine=snowflake(UV+vec2(.1,0),t,24.,19.)*.38;
        float near=snowDepth(UV+vec2(.2,0),t,13.,29.,1.)*.98;
        float totalSnow=far+farFine+mid+midFine+near;
        totalSnow=S(0.,1.,totalSnow*intensity);
        // frost at edges
        float frost=frostEdge(UV,t)*cond;
        vec3 frostCol=vec3(.78,.85,.88);
        col=mix(col,frostCol,frost*0.35);
        // snowflakes
        col=mix(col,vec3(.9,.95,.98),totalSnow*0.6);
        // accumulation
        float accum=snowAccum(UV,t)*cond*0.2;
        col=mix(col,vec3(.85,.9,.92),accum);
    }

    if(modeIdx==4.){
        // Fog
        float dens=fogDensity(UV,t);
        vec3 fogCol=mix(vec3(.4,.45,.5),vec3(.6,.65,.7),dens);
        float fogAmt=S(.2,.8,dens)*cond;
        col=mix(col,fogCol,fogAmt*0.5);
        // warp through fog
        vec2 fogWarp=vec2(fbm(UV*3.+t*0.005)-.5,fbm(UV*3.+t*0.003+1.)-.5)*0.006*refr;
        col=mix(col,getBg(UV+fogWarp,u_res),0.2);
        col*=1.-fogAmt*0.2;
    }

    // ── Glass condensation layer (all modes) ──
    float cndLayer=cond*(0.3+fbm(UV*6.+t*0.003)*0.2);
    col=mix(col,vec3(.6,.7,.75),cndLayer*0.06);
    // ── Subtle glass reflection ──
    float refl=0.04*exp(-pow((UV.x+UV.y*0.2-0.7)/0.08,2.));
    col+=vec3(.7,.8,.85)*refl;

    // ── Brightness ──
    col+=bright;

    // ── Vignette ──
    vec2 vUV=UV-.5;
    col*=1.-dot(vUV,vUV)*.4;

    fragColor=vec4(clamp(col,0.,1.),1.);
}
`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['u_t','u_res','u_mode','u_intensity','u_speed','u_cond','u_refr','u_bright','u_lightning','u_bgTex','u_bgAspect','u_bgReady']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ── Load background texture ──
const BG_IMG = 'city_night_bg.png';
const bgTex = gl.createTexture();
const bgImg = new Image();
let bgLoaded = false;
let bgAspect = 1;
let bgReady = false;
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, bgTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([40, 60, 78, 255]));
bgImg.onload = () => {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, bgImg);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.generateMipmap(gl.TEXTURE_2D);
  bgAspect = bgImg.naturalWidth / Math.max(bgImg.naturalHeight, 1);
  bgLoaded = true;
  bgReady = true;
  console.log('Background texture loaded');
};
bgImg.onerror = () => {
  bgReady = false;
  console.error('Failed to load background image:', BG_IMG);
  document.getElementById('weather-sub').textContent = '背景图片未加载，已使用内置背景';
};
bgImg.src = BG_IMG;

let time = 0, lastT = 0, lastFrameAt = 0;
const Params = {
  mode: 0, intensity: 1.0, speed: 1.0,
  cond: 0.3, refr: 1.0, bright: 0.0, lightning: 0.0
};

const WEATHER_NAMES = ['☀️ 晴天', '⛅ 多云', '🌧️ 雨', '❄️ 雪', '🌫️ 雾'];
const WEATHER_SUBS = [
  '阳光透过玻璃窗洒落',
  '云层在窗外缓缓流动',
  '雨水在玻璃上流淌',
  '雪花飘落在窗沿',
  '雾气弥漫在窗外'
];

const requestedMode = Number(new URLSearchParams(location.search).get('mode'));
if (Number.isInteger(requestedMode) && requestedMode >= 0 && requestedMode < WEATHER_NAMES.length) {
  Params.mode = requestedMode;
  document.querySelectorAll('.weather-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.mode) === requestedMode);
  });
  document.getElementById('weather-name').textContent = WEATHER_NAMES[requestedMode];
  document.getElementById('weather-sub').textContent = WEATHER_SUBS[requestedMode];
  document.getElementById('lightning-section').style.display = requestedMode === 2 ? '' : 'none';
}

function frame(ts) {
  if (ts - lastFrameAt < 1000 / 30) {
    requestAnimationFrame(frame);
    return;
  }
  lastFrameAt = ts;
  const dt = (ts - lastT) / 1000 || 0;
  lastT = ts;
  time += dt * Params.speed;

  gl.useProgram(prog);
  gl.uniform1f(U.u_t, time);
  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform1f(U.u_mode, Params.mode);
  gl.uniform1f(U.u_intensity, Params.intensity);
  gl.uniform1f(U.u_speed, Params.speed);
  gl.uniform1f(U.u_cond, Params.cond);
  gl.uniform1f(U.u_refr, Params.refr);
  gl.uniform1f(U.u_bright, Params.bright);
  gl.uniform1f(U.u_lightning, Params.lightning);
  gl.uniform1f(U.u_bgAspect, bgAspect);
  gl.uniform1f(U.u_bgReady, bgReady ? 1 : 0);
  gl.uniform1i(U.u_bgTex, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── UI ──
const sidebar = document.getElementById('sidebar');

document.querySelectorAll('.weather-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    Params.mode = parseFloat(btn.dataset.mode);
    const idx = parseInt(btn.dataset.mode);
    document.getElementById('weather-name').textContent = WEATHER_NAMES[idx];
    document.getElementById('weather-sub').textContent = WEATHER_SUBS[idx];
    document.getElementById('lightning-section').style.display = idx === 2 ? '' : 'none';
  });
});

function bindSlider(id, param, displayId, fmt) {
  const sl = document.getElementById(id);
  const val = document.getElementById(displayId);
  sl.addEventListener('input', () => {
    Params[param] = parseFloat(sl.value);
    val.textContent = fmt(sl.value);
  });
}
bindSlider('sl-intensity', 'intensity', 'val-intensity', v => Math.round(v * 100) + '%');
bindSlider('sl-speed', 'speed', 'val-speed', v => parseFloat(v).toFixed(1) + 'x');
bindSlider('sl-cond', 'cond', 'val-cond', v => Math.round(v * 100) + '%');
bindSlider('sl-refr', 'refr', 'val-refr', v => Math.round(v * 100) + '%');
bindSlider('sl-bright', 'bright', 'val-bright', v => parseFloat(v).toFixed(2));
bindSlider('sl-lightning', 'lightning', 'val-lightning', v => Math.round(v * 100) + '%');

document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
  sidebar.classList.toggle('hidden');
});

// UI toggle
const bar = document.getElementById('weather-bar');
const title = document.getElementById('title-bar');
const restoreBtn = document.getElementById('btn-restore');
let uiHidden = false;

document.getElementById('btn-toggle-ui').addEventListener('click', () => {
  uiHidden = !uiHidden;
  bar.style.opacity = uiHidden ? '0' : '1';
  bar.style.pointerEvents = uiHidden ? 'none' : '';
  title.style.opacity = uiHidden ? '0' : '0.6';
  restoreBtn.classList.toggle('visible', uiHidden);
});

restoreBtn.addEventListener('click', () => {
  uiHidden = false;
  bar.style.opacity = '1';
  bar.style.pointerEvents = '';
  title.style.opacity = '0.6';
  restoreBtn.classList.remove('visible');
});
</script>
</body>
</html>
