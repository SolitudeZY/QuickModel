<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuickModel 健康实验</title>
<style>body{font:16px system-ui;background:#f4f7f6;color:#213c35;max-width:900px;margin:40px auto;padding:20px}section{background:white;padding:24px;border-radius:16px;margin:18px 0}button{background:#246c59;color:white;border:0;border-radius:8px;padding:12px 18px;margin:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto;background:#f2f5f4;padding:16px}img{width:280px;max-width:90%}small{color:#536b64}</style>
<h1>QuickModel · 健康数据实验</h1><p>小米手环 10 · 中国区 · 最近 7 天</p>
<section><h2>1. 连接自己的小米账号</h2><p>使用米家或支持小米账号扫码的 App 扫描，并在手机上确认。请先让小米运动健康完成手环同步。</p><small>非官方接口实验。登录会话加密保存在你的服务器；数据不发送给 AI。</small><p><button id="login">生成登录二维码</button><button id="check">检查连接</button></p><img id="qr" hidden><p id="status">尚未检查连接</p></section>
<section><h2>2. 读取与查看</h2><p>仅手动读取步数、心率和睡眠；暂未开启定时任务。无记录不代表数值为零。</p><button id="sync">同步最近 7 天</button><button data-view="summary">每日汇总</button><button data-view="heart-rate">心率记录</button><button data-view="sleep">睡眠记录</button><button data-view="coverage">数据覆盖</button><pre id="out">等待连接账号。</pre></section>
<script>
const statusEl=document.getElementById('status'),out=document.getElementById('out');let generation=0,blobUrl;
async function call(action,body={}){const r=await fetch('/action/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-QM-Lab':'1'},body:JSON.stringify(body)});if(action==='image'&&r.ok)return r.blob();const d=await r.json();if(!r.ok)throw Error(d.message||'请求失败');return d;}
const show=d=>out.textContent=JSON.stringify(d,null,2);
document.getElementById('login').onclick=async()=>{const turn=++generation;document.getElementById('qr').hidden=true;try{statusEl.textContent='正在向小米申请二维码…';const d=await call('start');const b=await call('image',{token:d.qr_token});if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(b);document.getElementById('qr').src=blobUrl;document.getElementById('qr').hidden=false;statusEl.textContent='请扫码并在手机上确认';const until=Date.now()+Math.min(d.expires_in||300,600)*1000;while(turn===generation&&Date.now()<until){const p=await call('poll',{token:d.qr_token});if(p.status==='confirmed'){statusEl.textContent='账号已连接。可以同步最近 7 天数据。';document.getElementById('qr').hidden=true;return;}if(['expired','failed'].includes(p.status))throw Error(p.message||'二维码已过期，请重新生成');await new Promise(r=>setTimeout(r,2000));}if(turn===generation)statusEl.textContent='二维码已过期，请重新生成';}catch(e){if(turn===generation)statusEl.textContent=e.message;}};
document.getElementById('check').onclick=async()=>{try{const d=await call('connection');statusEl.textContent=d.connected?'账号连接正常':(d.message||'账号未连接或会话需要更新');show(d);}catch(e){statusEl.textContent=e.message;}};
document.getElementById('sync').onclick=async function(){this.disabled=true;try{let d=await call('sync');show(d);while(d.sync_id&&['pending','running','queued','started','accepted'].includes(d.status)){await new Promise(r=>setTimeout(r,2500));d=await call('progress',{sync_id:d.sync_id});show(d);}}catch(e){out.textContent=e.message;}finally{this.disabled=false;}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{try{show(await call(b.dataset.view));}catch(e){out.textContent=e.message;}});
</script></html>
